
name: Build ULTRON APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ULTRON
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Google Maven access
        run: |
          curl -I https://dl.google.com/dl/android/maven2/

      - name: Build ULTRON
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-APK
          path: app/build/outputs/apk/debug/*.apk
