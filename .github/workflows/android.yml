
name: Build ULTRON APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ULTRON
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Inspect project configuration
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== SETTINGS FILE ====="
          cat settings.gradle.kts
          echo "===== ROOT BUILD FILE ====="
          cat build.gradle.kts
          echo "===== GRADLE SETTINGS SEARCH ====="
          find . -name "settings.gradle*" -o -name "init.gradle*"

      - name: Build ULTRON
        run: gradle --no-daemon --stacktrace --info assembleDebug

      - name: Save APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ULTRON-APK
          path: app/build/outputs/apk/debug/*.apk
